[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading-desk"
version = "1.2.0"
description = "Reproducible cross-asset portfolio research, market-risk validation and desk simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "plotly>=5.18"]

[project.optional-dependencies]
markets = ["yfinance>=0.2"]
dashboard = ["streamlit>=1.35"]
ml = ["scikit-learn>=1.3"]
test = ["pytest>=7.0"]
all = ["yfinance>=0.2", "streamlit>=1.35", "pytest>=7.0", "scikit-learn>=1.3"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
